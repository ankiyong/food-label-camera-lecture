{id:'02',name:'무설탕 골든 크래커',en:'GOLDEN CRACKERS',verdict:'혈당 관리에 주의',good:false,title:'당류 0g이<br>탄수화물 0g은 아닙니다.',items:[['총탄수화물 40g · 식이섬유 1g','정제 밀가루·쌀가루·감자전분·말토덱스트린이 들어 있습니다. 당류 외 전분도 혈당에 영향을 줄 수 있습니다.'],['포화지방 6g · 하루 기준치 30%','팜유를 포함하며 포화지방 비중이 높습니다. 혈당뿐 아니라 지방 구성도 확인합니다.']],caution:'당뇨·당뇨 전단계라면 1봉지의 탄수화물과 섭취량을 확인합니다. 이상지질혈증·심혈관질환 관리 시 포화지방도 주의합니다.',sources:['cdc_carbs','ada_fats','fda_dv'],boxes:[[.105,.402,.79,.029],[.105,.51,.79,.054]],ingredientsBox:[.055,.847,.89,.067]},

{id:'04',name:'관절 보조제 JOINT PLUS',en:'JOINT PLUS',verdict:'낮은 함량 · 효과 근거 확인',good:false,title:'성분 이름만으로<br>관절 효과를 보장할 수 없습니다.',items:[['하루 1캡슐: 50mg + 25mg','글루코사민 염산염 50mg, 콘드로이틴 황산염 25mg입니다.'],['연구 투여량과 큰 차이','GAIT 연구의 하루 1,500mg·1,200mg과 비교하면 각각 1/30·1/48입니다. 그 연구에서도 전체 참가자의 통증 개선 효과는 뚜렷하지 않았습니다. 연구 투여량은 복용 권장량이 아닙니다.']],caution:'골관절염에 해롭다는 뜻이 아니라 치료 효과를 기대할 근거가 부족합니다. 당뇨 환자는 혈당 변화, 와파린 복용자는 상호작용을 확인해야 합니다.',sources:['gait','joint'],boxes:[[.027,.47,.94,.096],[.035,.727,.91,.038]]},

const PROMPT=`첨부한 외국 식품·영양제의 성분표를 한국어로 분석해줘.

1. 먼저 제품명, 1회 섭취량, 포장당 섭취 횟수, 주요 영양성분·원재료와 함량을 정확히 읽어줘. 안 보이는 글자·숫자는 추측하지 말고 ‘확인 불가’로 표시해줘.
2. ‘표시에서 확인한 사실’과 ‘건강상 해석’을 나눠줘. 1회분과 한 포장 전체의 양도 구분해줘.
3. 영양상 장점과 주의할 성분, 어떤 질환이나 복용약이 있을 때 특히 확인해야 하는지 설명해줘. 당류 0g·저지방 같은 문구만으로 판단하지 마.
4. 영양제라면 성분의 종류·하루 함량·효능 근거를 따로 확인해줘. 최신 공식 자료를 찾아 출처를 연결하고, 효과가 불확실하면 그렇게 말해줘.
5. 마지막에 ‘확인한 사실 / 기대할 수 있는 점 / 주의할 점 / 추가 확인 사항’을 표로 정리해줘.`;

let checked=new Set(Array.isArray(saved.checked)?saved.checked.filter(x=>CASES.some(c=>c.id===x)):[]),revealed=new Set(),slide=0,lastFocus=null,viewer=null,toastTimer,demoRevealed=false;

 else if(slide===3){stage.innerHTML=`<section class="slide practice-slide">${head('5개 제품을 직접 확인해 보세요.','<button data-action="prompt">질문 예시</button>')}<div class="practice-top"><p>포인터 다음: 사례 확대 → 성분표만 → 확인 완료. CASE 01부터 순서대로 진행합니다.</p><span class="progress-label">확인 완료 <b>${checked.size}</b> / 5</span></div><div class="slide-body"><div class="gallery">${CASES.map(c=>`<article class="case-card ${checked.has(c.id)?'checked':''}"><div class="card-head"><span class="case-no">CASE ${c.id}</span><span>눌러서 확대 ↗</span></div><button class="pair-thumb" data-view="${c.id}" data-mode="pair" aria-label="CASE ${c.id} 제품과 성분표 확대">${img('case'+c.id+'_pack',c.name+' 제품')}${img('case'+c.id+'_label',c.name+' 성분표')}</button><div class="card-foot"><span class="card-name">${c.name}</span><button class="check-button ${checked.has(c.id)?'done':''}" data-check="${c.id}" aria-pressed="${checked.has(c.id)}">${checked.has(c.id)?'✓ 확인 완료':'확인 완료'}</button></div></article>`).join('')}</div><div class="practice-bottom"><div class="left"><p class="hint">좋아 보이는 문구와 실제 성분이 일치하는지 살펴봅니다.<br>아직 해설은 공개되지 않습니다.</p><button class="ghost" data-action="mark-all">강사 · 전체 실습 완료</button></div><button class="primary" data-action="start-answers" ${allDone()?'':'disabled'}>${allDone()?'해설을 하나씩 확인 →':'5개 확인 후 해설 시작'}</button></div></div></section>`}
 else{renderAnswer(CASES[slide-4])}
 stage.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>openViewer(b.dataset.view,b.dataset.mode));
 stage.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>toggleCheck(b.dataset.check));
 stage.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>go(Number(b.dataset.case)+4));
 stage.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));
 requestAnimationFrame(fitLabelFrames);
}
function fitLabelFrames(){stage.querySelectorAll('.answer-label .label-frame,.camera-label .label-frame').forEach(frame=>{const p=frame.parentElement;const width=Math.min(p.clientWidth,p.clientHeight*2/3);frame.style.width=width+'px';frame.style.height=(width*1.5)+'px';frame.style.flexShrink='0'});stage.querySelectorAll('.answer-pack .image-button').forEach(b=>b.style.height='100%')}
function renderAnswer(c){const isOpen=revealed.has(c.id);const nav=`<div class="answer-case-nav" aria-label="사례별 해설">${CASES.map((x,i)=>`<button class="${x.id===c.id?'active':''}" data-case="${i}" aria-label="CASE ${x.id} 해설">${x.id}</button>`).join('')}</div>`;stage.innerHTML=`<section class="slide">${head(`CASE ${c.id} · ${c.name}`,nav)}<div class="slide-body answer-body"><div class="answer-pack"><button class="image-button" data-view="${c.id}" data-mode="pack" aria-label="${c.name} 제품 확대">${img('case'+c.id+'_pack',c.name+' 포장')}</button></div><div class="answer-label"><div class="label-frame" role="button" tabindex="0" data-view="${c.id}" data-mode="label" aria-label="${c.name} 표시된 성분 확대">${img('case'+c.id+'_label',c.name+' 영양성분표')}${isOpen?marks(c):''}</div></div><div class="answer-copy">${isOpen?`<p class="verdict ${c.good?'good':''}">${c.verdict}</p><h2>${c.title}</h2><div class="answer-items">${c.items.map(x=>`<div class="answer-item"><b>${x[0]}</b><p>${x[1]}</p></div>`).join('')}</div><div class="disease"><b>${c.good?'함께 확인할 점':'질환·복용약과 연결해서 보기'}</b>${c.caution}</div><p class="answer-source">표시 수치는 가상 제품의 설정입니다. 질환·효능 해석은 공식 자료를 참고했습니다.<br><button data-action="sources">이 사례의 근거 ${c.sources.length}건 보기</button> · <button data-action="hide-answer">해설 다시 가리기</button></p>`:`<div class="answer-covered"><p class="verdict">먼저 여러분의 판단을 나눠보세요.</p><div class="large-question">어떤 성분을<br>확인하셨나요?</div><p>장점, 주의할 점, 추가로 확인할 근거를 이야기해 봅니다.</p><button class="accent" data-action="reveal">해설 공개</button></div>`}</div></div></section>`;stage.querySelectorAll('.label-frame[tabindex]').forEach(b=>b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openViewer(c.id,'label')}})}
function marks(c){return [...c.boxes,...(c.ingredientsBox?[c.ingredientsBox]:[])].map((r,i)=>`<span class="highlight ${c.good?'good':''}" style="left:${r[0]*100}%;top:${r[1]*100}%;width:${r[2]*100}%;height:${r[3]*100}%;animation-delay:${i*.08}s"></span>`).join('')}

function demoUnderlines(){return [
 [.17,.392,.705],[.13,.476,.745],[.13,.504,.745],[.17,.531,.705]
].map((r,i)=>'<span class="demo-underline" aria-hidden="true" style="left:'+r[0]*100+'%;top:'+r[1]*100+'%;width:'+r[2]*100+'%;animation-delay:'+i*.12+'s"></span>').join('')}
function demoExplanation(){return '<aside class="demo-copy" aria-label="성분표 해설"><p class="verdict">1회분 60g 기준 · 한 봉지는 4회분</p><h2>당류가 0g이어도<br>확인할 성분이 있습니다.</h2><div class="demo-point"><b>총탄수화물 34g · 식이섬유 1g</b><p>정제 밀가루·쌀가루·전분이 들어 있습니다. 당뇨가 있다면 당류 외 탄수화물과 실제 섭취량도 확인합니다.</p></div><div class="demo-point"><b>포화지방 8g · 하루 기준치 40%</b><p>팜유·코코넛오일이 포함됩니다. 이상지질혈증·심혈관질환 관리 시 포화지방 섭취량을 주의합니다.</p></div><div class="demo-point"><b>나트륨 580mg · 하루 기준치 25%</b><p>고혈압 관리 시 주의할 수치입니다. 한 봉지를 모두 먹으면 나트륨은 2,320mg입니다.</p></div><p class="demo-note">1회분 280kcal · 한 봉지 1,120kcal<br>‘당류 0g’은 ‘탄수화물 0g’이라는 뜻이 아닙니다.</p><button class="ghost" data-action="sources">해설 근거 보기</button></aside>'}
function nextStep(){
 if(modalRoot.children.length){
  if(viewer&&slide===3&&viewer.id!=='demo'){
   if(viewer.mode!=='label'){viewer.mode='label';viewer.scale=1;drawViewer();return}
   checked.add(viewer.id);persist();closeModal();render();return
  }
  closeModal();return
 }
 exitCamera();
 if(slide===2&&!demoRevealed){demoRevealed=true;render();return}
 if(slide===3){const pending=CASES.find(c=>!checked.has(c.id));if(pending){openViewer(pending.id,'pair');return}revealed.delete('01');go(4);return}
 if(slide>=4&&!revealed.has(CASES[slide-4].id)){revealed.add(CASES[slide-4].id);render();return}
 if(slide<8){if(slide>=4)revealed.delete(CASES[slide-3].id);go(slide+1)}
}
function previousStep(){
 if(modalRoot.children.length){if(viewer&&slide===3&&viewer.mode==='label'){viewer.mode='pair';viewer.scale=1;drawViewer();return}closeModal();return}
 exitCamera();
 if(slide===2&&demoRevealed){demoRevealed=false;render();return}
 if(slide===3){demoRevealed=true;go(2);return}
 if(slide>=4&&revealed.has(CASES[slide-4].id)){revealed.delete(CASES[slide-4].id);render();return}
 if(slide>4)revealed.add(CASES[slide-5].id);
 go(slide-1)
}

function go(n){if(n<0||n>8)return;if(n===0||(n===2&&slide<2))demoRevealed=false;if(n>3&&!allDone()){toast('5개 사례를 확인한 뒤 해설을 시작합니다.');return}document.body.classList.remove('camera-clean');document.querySelector('.camera-exit')?.remove();slide=n;render();window.scrollTo({top:0,behavior:'instant'})}
function toggleCheck(id){if(checked.has(id))checked.delete(id);else checked.add(id);persist();render()}
function action(name){if(name==='prompt')openPrompt();if(name==='camera')cameraOnly();if(name==='demo-answer'){exitCamera();demoRevealed=!demoRevealed;render();}if(name==='start-answers')go(4);if(name==='mark-all'){checked=new Set(CASES.map(c=>c.id));persist();render();toast('전체 실습을 완료했습니다. 해설을 시작할 수 있습니다.')}if(name==='reveal'){revealed.add(CASES[slide-4].id);render()}if(name==='hide-answer'){revealed.delete(CASES[slide-4].id);render()}if(name==='sources')openSources(slide>=4?CASES[slide-4].sources:undefined)}
function cameraOnly(){demoRevealed=false;render();document.body.classList.add('camera-clean');const b=document.createElement('button');b.className='camera-exit';b.textContent='촬영용 보기 닫기 · Esc';b.onclick=exitCamera;document.body.appendChild(b);toast('성분표 전체와 숫자가 선명하게 보이도록 촬영하세요.')}function exitCamera(){document.body.classList.remove('camera-clean');document.querySelector('.camera-exit')?.remove();requestAnimationFrame(fitLabelFrames)}
function openModal(content,cls=''){lastFocus=document.activeElement;document.body.classList.add('modal-open');modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal ${cls}" role="dialog" aria-modal="true" aria-label="확대 및 설명 창">${content}</section></div>`;modalRoot.querySelector('.modal-backdrop').onclick=e=>{if(e.target.classList.contains('modal-backdrop'))closeModal()};modalRoot.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);setTimeout(()=>modalRoot.querySelector('button,textarea,a')?.focus(),10)}
function closeModal(){viewer=null;modalRoot.innerHTML='';document.body.classList.remove('modal-open');lastFocus?.focus?.()}
function openViewer(id,mode='pair'){const isDemo=id==='demo',c=isDemo?null:CASES.find(x=>x.id===id);viewer={id,mode,scale:1};openModal(`<div class="modal-header"><div><div class="modal-title">${isDemo?'강사 시연 · Sea Salt Crackers':`CASE ${id} · ${c.name}`}</div><div class="sub">성분표 전체가 들어오도록 촬영하세요.</div></div><div class="modal-tools"><button data-mode="pair">제품 + 성분표</button><button data-mode="label">성분표만</button><button data-zoom="out" aria-label="축소">−</button><button data-zoom="in" aria-label="확대">＋</button><button data-zoom="fit">맞춤</button><button class="close-button" data-close aria-label="닫기">×</button></div></div><div class="viewer-viewport"><div class="viewer-space"><div class="viewer-content"></div></div></div><div class="modal-footer"><p>${isDemo?'포장과 성분표의 숫자를 함께 확인합니다.':'포인터 다음: 성분표만 보기 → 확인 완료 · 이전: 되돌리기'}</p><div class="actions"><button data-prompt>질문 예시</button>${isDemo?'':`<button class="primary" data-complete>${checked.has(id)?'✓ 확인 완료':'이 사례 확인 완료'}</button>`}<button data-close>닫기</button></div></div>`);viewer={id,mode,scale:1};modalRoot.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{viewer.mode=b.dataset.mode;viewer.scale=1;drawViewer()});modalRoot.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{viewer.scale=b.dataset.zoom==='fit'?1:Math.max(.5,Math.min(4,viewer.scale+(b.dataset.zoom==='in'?.25:-.25)));drawViewer()});modalRoot.querySelector('[data-prompt]').onclick=openPrompt;const done=modalRoot.querySelector('[data-complete]');if(done)done.onclick=()=>{checked.add(id);persist();render();closeModal();toast(`CASE ${id} 확인을 완료했습니다.`)};requestAnimationFrame(drawViewer)}
function drawViewer(){if(!viewer)return;const v=viewer,prefix=v.id==='demo'?'demo':'case'+v.id,keys=v.mode==='pair'?['pack','label']:[v.mode==='pack'?'pack':'label'];const viewport=modalRoot.querySelector('.viewer-viewport'),content=modalRoot.querySelector('.viewer-content');if(!viewport||!content)return;const unit=Math.min((viewport.clientWidth-50-(keys.length-1)*12)/keys.length,(viewport.clientHeight-32)*2/3);content.style.width=Math.max(150,unit*keys.length*viewer.scale+(keys.length-1)*12)+'px';content.innerHTML=keys.map(k=>`<div class="viewer-image">${img(prefix+'_'+k,k==='pack'?'제품 포장':'영양성분표')}${k==='label'&&slide>=4&&v.id!=='demo'&&revealed.has(v.id)?marks(CASES.find(c=>c.id===v.id)):''}</div>`).join('');modalRoot.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===v.mode))}
function openPrompt(){viewer=null;openModal(`<div class="modal-header"><div class="modal-title">사진과 함께 사용할 질문</div><button class="close-button" data-close aria-label="닫기">×</button></div><div class="drawer-body"><label for="promptText" class="hint">필요한 부분을 바꿔서 사용하세요.</label><textarea id="promptText" class="prompt-text" readonly>${esc(PROMPT)}</textarea><div class="prompt-actions"><button class="primary" id="copyPrompt">질문 복사</button><span class="hint" id="copyStatus">사진을 첨부한 채팅에 붙여넣습니다.</span></div><div class="prompt-help"><b>사진 분석 순서</b><ol><li>휴대전화 카메라로 성분표 촬영</li><li>ChatGPT 채팅의 <b>+</b> → 사진·파일 추가에서 첨부</li><li>성분표가 잘리지 않게 밝고 선명하게 촬영</li><li>위 질문을 입력하고 응답 확인</li><li>숫자·단위·1회 섭취량을 원본과 다시 대조</li></ol></div><p class="hint" style="margin-top:15px">앱에 카메라 메뉴가 보이면 바로 촬영해도 됩니다. 이 수업은 <b>사진 첨부</b> 방식입니다. 음성 모드의 실시간 영상은 별도 기능이며 플랜·사용 한도가 다를 수 있습니다. 메뉴 이름은 기기와 앱 화면에 따라 다를 수 있습니다.</p><p class="hint" style="margin-top:10px">사진만으로 개인의 진단·복용량을 확정하지 않습니다. <a href="https://help.openai.com/en/articles/8400551-chatgpt-image-inputs-faq" target="_blank" rel="noopener noreferrer">OpenAI 사진 첨부 안내 ↗</a></p></div>`,'drawer');document.getElementById('copyPrompt').onclick=async()=>{try{await navigator.clipboard.writeText(PROMPT);document.getElementById('copyStatus').textContent='복사했습니다.'}catch(e){const t=document.getElementById('promptText');t.focus();t.select();try{document.execCommand('copy');document.getElementById('copyStatus').textContent='선택한 질문을 복사해 사용하세요.'}catch(x){document.getElementById('copyStatus').textContent='질문을 선택한 뒤 직접 복사하세요.'}}}}
function openSources(keys){const selected=Array.isArray(keys)?keys.map(k=>SOURCES[k]).filter(Boolean):Object.values(SOURCES);viewer=null;openModal(`<div class="modal-header"><div class="modal-title">해설의 근거와 출처</div><button class="close-button" data-close aria-label="닫기">×</button></div><div class="drawer-body"><p>이미지와 성분 수치는 <b>교육용 가상 제품</b>입니다. 실제 제품의 임상 효과를 시험한 자료가 아닙니다.</p><p>보조제의 낮은 함량은 연구 결과를 그대로 적용하기 어렵다는 뜻입니다. 함량만으로 ‘효과 없음’을 단정하거나 연구 투여량을 복용 권장량으로 사용하지 않습니다.</p><div class="source-list">${selected.map(s=>`<div class="source-entry"><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.name} ↗</a><p>${s.note}</p></div>`).join('')}</div><p class="hint" style="margin-top:22px">자료 확인: 2026년 11월 6일 · %DV는 미국 표시 기준이며 개인별 섭취 목표와 다를 수 있습니다.</p></div>`,'drawer')}
function openDemoAnswer(){viewer=null;openModal(`<div class="modal-header"><div class="modal-title">강사 시연 해설 · Sea Salt Crackers</div><button class="close-button" data-close aria-label="닫기">×</button></div><div class="drawer-body"><h3>당류 0g만으로 판단하지 않습니다.</h3><p><b>1회분 60g:</b> 총탄수화물 34g, 식이섬유 1g, 포화지방 8g, 나트륨 580mg, 280kcal입니다.</p><p><b>한 포장은 4회분:</b> 전부 먹으면 총탄수화물 136g, 포화지방 32g, 나트륨 2,320mg, 1,120kcal입니다.</p><p>정제 밀가루·쌀가루·감자전분·말토덱스트린을 포함하므로 당뇨 관리에서는 총탄수화물과 섭취량을 봅니다. 고혈압에는 나트륨, 이상지질혈증·심혈관질환에는 포화지방도 함께 확인합니다.</p><p class="prompt-help">‘당류 0g’은 ‘탄수화물 0g’이 아닙니다. 포장의 0g SUGAR 표시만으로 ‘당류 무첨가’라고 번역해서도 안 됩니다.</p><p class="hint" style="margin-top:18px">CDC 탄수화물 안내 · NHLBI DASH 식사 · 미국당뇨병학회 지방 안내 참고</p></div>`,'drawer')}
function openHelp(){viewer=null;openModal(`<div class="modal-header"><div class="modal-title">강의 진행 방법</div><button class="close-button" data-close aria-label="닫기">×</button></div><div class="drawer-body"><h3>시연 → 실습 → 해설</h3><p>처음 3장은 제품 → 제품과 성분표 → 성분표 순서입니다. 세 번째 장의 <b>촬영용 전체 보기</b>를 누르면 촬영할 성분표만 화면에 남습니다.</p><p>실습 화면은 CASE 01~05를 각각 눌러 확대합니다. 다섯 사례의 <b>확인 완료</b>를 누르면 해설을 열 수 있습니다. 강사는 <b>전체 실습 완료</b>로 한 번에 진행할 수 있습니다.</p><p>해설은 각 사례의 <b>해설 공개</b>를 눌러 하나씩 확인합니다. 붉은 테두리는 주의·검토 항목, 초록 테두리는 영양상 장점입니다.</p><p><b>포인터 다음 / 이전</b>으로 전체 강의를 진행합니다. Page Down·→·↓·Space·Enter는 다음, Page Up·←·↑는 이전입니다. <b>F</b> 전체 화면 · <b>Esc</b> 확대/촬영용 보기 닫기</p><p>3페이지의 다음 버튼은 <b>오른쪽 설명과 빨간 밑줄</b>을 먼저 보여줍니다. 한 번 더 누르면 실습으로 이동합니다.</p><p>실습에서는 다음 버튼으로 각 사례의 <b>제품과 성분표 → 성분표만 → 확인 완료</b>를 순서대로 진행합니다. 해설 장표에서는 <b>공개 → 다음 사례</b>로 진행합니다.</p><div style="margin-top:22px"><button id="resetProgress">실습 확인 기록 초기화</button></div></div>`,'drawer');document.getElementById('resetProgress').onclick=()=>{checked.clear();revealed.clear();demoRevealed=false;persist();closeModal();go(0);toast('실습 확인 기록을 초기화했습니다.')}}
async function fullscreen(){try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){toast('브라우저의 전체 화면 기능을 사용해 주세요.')}}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav==='demo'?0:b.dataset.nav==='practice'?3:4));
document.getElementById('previous').onclick=previousStep;document.getElementById('next').onclick=nextStep;document.getElementById('helpButton').onclick=openHelp;document.getElementById('sourcesButton').onclick=openSources;document.getElementById('fullscreenButton').onclick=fullscreen;
document.addEventListener('keydown',e=>{
 if(e.ctrlKey||e.altKey||e.metaKey)return;
 if(e.key==='Escape'){e.preventDefault();if(modalRoot.children.length)closeModal();else exitCamera();return}
 if(e.key==='Tab'&&modalRoot.children.length){const els=[...modalRoot.querySelectorAll('button:not(:disabled),a[href],textarea')].filter(x=>x.offsetParent!==null);if(els.length){const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}return}
 if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')||document.activeElement?.isContentEditable)return;
 const nextKeys=['PageDown','ArrowRight','ArrowDown',' ','Enter'],prevKeys=['PageUp','ArrowLeft','ArrowUp'];
 if(nextKeys.includes(e.key)||prevKeys.includes(e.key)){e.preventDefault();e.stopImmediatePropagation();if(e.repeat)return;(nextKeys.includes(e.key)&&!e.shiftKey?nextStep:previousStep)();return}
 if(e.key.toLowerCase()==='f'){e.preventDefault();if(!e.repeat)fullscreen()}
},true);
stage.addEventListener('click',e=>{if(e.target.closest('button,a,input,textarea,select,[role="button"]')||window.getSelection()?.toString()||modalRoot.children.length)return;nextStep()});
window.addEventListener('resize',()=>{if(viewer)drawViewer();fitLabelFrames()});
render();
</script>
